<!DOCTYPE html>
<html lang="pt-BR" data-theme="system" data-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volum</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mascot.css">
  <!-- Temas: a parte comum; o arquivo do tema escolhido entra pelo app.js (Volum.useSkin) -->
  <link rel="stylesheet" id="skinBase" href="skins/base.css">
</head>
<body>

  <main id="card" class="card">
    <!-- Enfeite dos temas (neve, luzes): escondido no tema padrão; regras no skins.css -->
    <div class="deco" aria-hidden="true"><i class="d-snow1"></i><i class="d-snow2"></i><i class="d-cap"></i><i class="d-base"></i><i class="d-l d-l0"></i><i class="d-l d-l1"></i><i class="d-l d-l2"></i><i class="d-l d-l3"></i><i class="d-pile"></i><i class="d-sleigh"></i></div>

    <!-- Cabeçalho: "Volum" e os 4 botões (sugestões, travar teclado, configurações, minimizar).
         Ícones de traço, todos com o mesmo peso (classe .ico). -->
    <header class="header">
      <span class="brand"><span class="brand-mascot" id="brandMascot" aria-hidden="true"></span>Volum</span>

      <!-- Apoiar o Volum: abre as configurações na seção "Apoiar" (Pix no Brasil, Ko-fi fora) -->
      <button id="supportBtn" class="icon-btn" title="Apoiar o Volum" data-i18n-title="supportTitle">
        <svg class="ico" data-anim="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>
      </button>

      <!-- Sugestões e bugs: abre o formulário no site (pelo C#) -->
      <button id="feedbackBtn" class="icon-btn" title="Sugestões e bugs" data-i18n-title="feedback">
        <svg class="ico" data-anim="chat" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-5.5L7 21v-3.5a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3z"/><path class="a-dot1" d="M8.5 11h.01" stroke-width="2.2"/><path class="a-dot2" d="M12 11h.01" stroke-width="2.2"/><path class="a-dot3" d="M15.5 11h.01" stroke-width="2.2"/></svg>
      </button>

      <!-- Travar o teclado para limpar (o C# trava e mostra o aviso com o botão Destravar) -->
      <button id="kbLockBtn" class="icon-btn" title="Travar teclado para limpar" data-i18n-title="kbLock">
        <svg class="ico" data-anim="keys" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path class="a-keys" d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01" stroke-width="2.2"/><path class="a-space" d="M8.5 14h7"/></svg>
      </button>

      <!-- Equalizador: janela própria, o mesmo filtro que entra no motor de áudio -->
      <button id="eqBtn" class="icon-btn" title="Equalizador" data-i18n-title="eqTitle">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5v15M12 4.5v15M18 4.5v15M4.5 9H7.5M10.5 15H13.5M16.5 8H19.5"/></svg>
      </button>

      <!-- Configurações: abre a janela própria de configurações (pelo C#) -->
      <button id="settingsBtn" class="icon-btn" title="Configurações" data-i18n-title="settings">
        <svg class="ico" data-anim="gear" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>

      <!-- Minimizar: esconde o mixer (volta para a bandeja) -->
      <button id="minimizeBtn" class="icon-btn" title="Minimizar" data-i18n-title="minimize">
        <svg class="ico" data-anim="min" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
      </button>
    </header>

    <!-- Volume geral + microfone (a linha do microfone some se não houver microfone) -->
    <section class="panel master">
      <div id="master"></div>
      <!-- Escolher a saída (fone, soundbar...): mesmo jeito do microfone, embaixo do volume geral -->
      <div id="out" class="out" hidden>
        <div class="mic-picker">
          <button id="outPickBtn" class="mic-current" aria-expanded="false"
                  title="Escolher saída de áudio" data-i18n-title="outPick">
            <span id="outCurrent"></span>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 6.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="outList" class="mic-list" inert>
            <div class="mic-list-inner" role="listbox"></div>
          </div>
        </div>
      </div>
      <div id="mic" class="mic" hidden>
        <div id="micRow"></div>
        <!-- Escolher o microfone: nome do atual, discreto; o clique abre a lista dos conectados -->
        <div class="mic-picker">
          <button id="micPickBtn" class="mic-current" aria-expanded="false"
                  title="Escolher microfone" data-i18n-title="micPick">
            <span id="micCurrent"></span>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 6.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="micList" class="mic-list" inert>
            <div class="mic-list-inner" role="listbox"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Água bebida hoje (só com o lembrete de água ligado) -->
    <section id="water" class="panel water" hidden>
      <div class="water-row">
        <svg class="water-drop ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8c3.7 4.3 6.6 8 6.6 11.4a6.6 6.6 0 0 1-13.2 0C5.4 10.8 8.3 7.1 12 2.8z"/></svg>
        <div class="water-text">
          <span class="water-label" data-i18n="water">Água hoje</span>
          <span class="water-amount" id="waterAmount"></span>
        </div>
        <button id="waterMinus" class="water-minus" title="Tirar um copo" data-i18n-title="waterMinus">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" stroke-width="2.4"/></svg>
        </button>
        <button id="waterPlus" class="water-add"></button>
      </div>
      <div class="water-bar"><span id="waterFill"></span></div>
    </section>

    <!-- Apps -->
    <div class="section-label">
      <span data-i18n="apps">Aplicativos</span>
      <span id="appCount" class="count">0</span>
    </div>
    <section id="apps" class="apps"></section>
    <p id="empty" class="empty" hidden data-i18n="empty">Nenhum app usando áudio agora</p>

    <!-- Novidades: aparece uma vez, na primeira abertura depois de atualizar (textos no NEWS do shared.js) -->
    <div id="news" class="news" hidden role="dialog" aria-modal="true" aria-labelledby="newsTitle">
      <div class="news-box">
        <!-- Mascote em pixel art (o mesmo da ilha; o app.js põe o desenho aqui) -->
        <!-- Confete de pixel caindo na entrada (o app.js põe os pedacinhos) -->
        <div class="news-confetti" id="newsConfetti" aria-hidden="true"></div>
        <span class="news-mascot" id="newsMascot" aria-hidden="true"></span>
        <h2 id="newsTitle" class="news-title"><small></small><span></span></h2>
        <!-- Uma novidade por vez (ilustração animada, título e texto); o app.js monta a partir do NEWS -->
        <div class="news-stage" id="newsStage"></div>
        <div class="news-foot">
          <div class="news-dots" id="newsDots"></div>
          <button id="newsOk" class="news-ok" data-i18n="newsNext">Próximo</button>
        </div>
      </div>
    </div>

  </main>

  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
