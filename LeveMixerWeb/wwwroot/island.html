<!DOCTYPE html>
<!-- Ilha do Volum (estilo Dynamic Island), aberta pelo IslandForm.cs, grudada no topo da tela.
     A janela é transparente: a pílula preta (.shape) é desenhada aqui e cresce/encolhe com o CSS.
     Fechada: bateria (ou a capa, com música), hora e onda de áudio. Recolhida: um risquinho.
     Aberta: data e hora, páginas Player e Água (setas ‹ › e bolinhas) e os avisos do Volum. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volum</title>
  <link rel="stylesheet" href="island.css">
  <link rel="stylesheet" href="mascot.css">
  <!-- Temas: a parte comum; o arquivo do tema escolhido entra pelo island.js (Volum.useSkin) -->
  <link rel="stylesheet" id="skinBase" href="skins/base.css">
</head>
<body>
  <!-- Degradê dos olhos do mascote (usado por todas as cópias dele na página) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Tema Bengala: listras vermelhas e brancas na diagonal, usadas no contorno da ilha -->
      <!-- Tema Miami: céu de fim de tarde (fundo) e moldura roxo → rosa → laranja (contorno) -->
      <!-- Tema Pôr do sol: céu da hora dourada (fundo) e borda clara de vidro (contorno) -->
      <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1d4a"/><stop offset=".45" stop-color="#6e3a72"/><stop offset=".78" stop-color="#d9636a"/><stop offset="1" stop-color="#ffb15e"/></linearGradient>
      <linearGradient id="sunsetGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset=".4" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffd38a" stop-opacity=".8"/></linearGradient>
      <linearGradient id="miamiSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2456"/><stop offset=".35" stop-color="#5a3382"/><stop offset=".7" stop-color="#a8477f"/><stop offset="1" stop-color="#e8826a"/></linearGradient>
      <linearGradient id="miamiFrame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f5cff"/><stop offset=".5" stop-color="#ff6fa8"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
      <pattern id="candyStripe" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
        <rect width="5" height="10" fill="#e0283f"/><rect x="5" width="5" height="10" fill="#ffffff"/>
      </pattern>
      <linearGradient id="mEyeL" x1="78.08" y1="253.03" x2="133.67" y2="156.74" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#f7f7f7"/><stop offset="1" stop-color="#002e5f"/>
      </linearGradient>
      <linearGradient id="mEyeR" x1="315.18" y1="253.03" x2="370.77" y2="156.74" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#f7f7f7"/><stop offset="1" stop-color="#002e5f"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="island" class="island closed">
    <!-- A forma é desenhada pelo island.js (SVG com cantos contínuos e as orelhas), animada por uma mola -->
    <div class="shape" aria-hidden="true"><svg class="shape-svg"><path id="shapePath"/></svg><div class="deco" aria-hidden="true"><i class="d-snow1"></i><i class="d-snow2"></i><i class="d-cap"></i><i class="d-base"></i><i class="d-l d-l0"></i><i class="d-l d-l1"></i><i class="d-l d-l2"></i><i class="d-l d-l3"></i><i class="d-pile"></i><i class="d-sleigh"></i></div></div>

    <!-- Fechada -->
    <div class="mini">
      <span class="mini-left">
        <img id="miniCover" class="mini-cover" alt="" hidden>
        <span class="battery" id="miniBattery" hidden></span>
        <!-- Mascote: aparece quando a ilha fica um tempo sem uso (o JS põe o desenho aqui) -->
        <span class="mini-mascot" id="miniMascot" hidden></span>
        <!-- Pomodoro rodando: anel que vai enchendo (a hora continua no meio) -->
        <svg class="mini-ring" id="miniRing" viewBox="0 0 20 20" aria-hidden="true" hidden>
          <circle cx="10" cy="10" r="7.5" class="ring-bg"/>
          <circle cx="10" cy="10" r="7.5" class="ring-fg" id="miniRingFg"/>
        </svg>
      </span>
      <b id="clock" class="clock">--:--</b>
      <!-- Direita: pontinhos de microfone/câmera em uso (como no iPhone) e a onda do som -->
      <span class="mini-right">
        <span class="privacy" id="miniPrivacy" hidden><i class="cam"></i><i class="mic"></i></span>
        <!-- Clima: ícone (sol, nuvem, chuva...) e a temperatura, com a cidade salva nas configurações -->
        <span class="mini-wx" id="miniWx" hidden><span class="mini-wx-icon" id="miniWxIcon"></span><b id="miniWxTemp"></b></span>
        <span class="wave" id="miniWave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </span>
    </div>

    <!-- Pomodoro rodando: bolha ao lado da ilha fechada; ao abrir a ilha, ela entra nela (vira o chip embaixo, à direita) -->
    <div class="pomo-bubble" id="pomoBubble" aria-hidden="true">
      <svg class="bubble-ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" class="ring-bg"/><circle cx="18" cy="18" r="14" class="ring-fg" id="bubbleRingFg"/></svg>
      <svg class="bubble-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#efe2e2"/><path d="M12 6.5V12l3.6 2.2" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <!-- Aviso do Volum: faixa fina, da altura da ilha (ex.: lembrete de água) -->
    <div class="noticebar" id="notice" hidden>
      <!-- Aviso de levantar: cena em pixel art do bonequinho (o island.js desenha aqui) -->
      <svg class="walk-scene" id="walkScene" aria-hidden="true"></svg>
      <span class="notice-icon" id="noticeIcon"></span>
      <span class="notice-text"><b id="noticeTitle"></b><span id="noticeBody"></span></span>
      <!-- Indicador de volume: barrinha com o nível -->
      <span class="osd-bar" id="osdBar" hidden><i></i></span>
      <button id="noticeAction" class="notice-action" hidden></button>
      <button id="noticeClose" class="notice-close" title="Fechar" aria-label="Fechar">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Aberta -->
    <div class="full" id="full">
      <div class="status">
        <span class="battery" id="battery" hidden></span>
        <span class="when"><span id="date"></span> <b id="time"></b></span>
        <!-- Rodinha do mouse na ilha: o volume aparece aqui no lugar da data, por um instante -->
        <span class="when-vol" aria-hidden="true">
          <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2.5l4.5 4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/></g></svg>
          <span class="osd-bar"><i id="volFill"></i></span>
          <b id="volPct"></b>
        </span>
        <span class="privacy" id="privacy" hidden><i class="cam"></i><i class="mic"></i></span>
      </div>

      <div class="pages">
        <button class="page-arrow left" id="pagePrev" aria-label="‹">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <!-- Página: player -->
        <section class="page" data-page="media">
          <div class="track" id="track">
            <div class="cover">
              <img id="cover" alt="" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zm10-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="meta">
              <b id="title" data-i18n="islandNothing">Nada tocando agora</b>
              <span id="subtitle"></span>
            </div>
            <!-- Onda do som (só com som saindo de verdade) -->
            <span class="wave" id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="progress" id="progress">
            <span id="elapsed">0:00</span>
            <div class="bar"><span id="barFill"></span></div>
            <span id="remaining">-0:00</span>
          </div>
          <div class="controls">
            <!-- Esquerda: mudo do som geral (o alto-falante cortado quando está mudo) -->
            <button class="side" id="muteBtn" title="Silenciar" data-i18n-title="islandMute">
              <svg class="i-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2v5.6c0 .6.4 1 1 1h3l4.6 3.9c.6.5 1.4.1 1.4-.7V5c0-.8-.8-1.2-1.4-.7L7.5 8.2h-3c-.6 0-1 .4-1 1z" fill="currentColor"/><path d="M16.5 8.8a4.6 4.6 0 0 1 0 6.4M19.2 6.2a8.4 8.4 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2v5.6c0 .6.4 1 1 1h3l4.6 3.9c.6.5 1.4.1 1.4-.7V5c0-.8-.8-1.2-1.4-.7L7.5 8.2h-3c-.6 0-1 .4-1 1z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button id="prev" title="Anterior" data-i18n-title="islandPrev">
              <svg class="i-skip" viewBox="0 0 32 18" aria-hidden="true"><path d="M15 2.2v13.6c0 1-1.1 1.6-1.9 1L3.6 10.2a1.5 1.5 0 0 1 0-2.4l9.5-6.6c.8-.6 1.9 0 1.9 1zM30 2.2v13.6c0 1-1.1 1.6-1.9 1l-9.5-6.6a1.5 1.5 0 0 1 0-2.4l9.5-6.6c.8-.6 1.9 0 1.9 1z" fill="currentColor"/></svg>
            </button>
            <button id="play" class="play" title="Tocar / pausar" data-i18n-title="islandPlay">
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.8v16.4c0 1.1 1.2 1.8 2.2 1.2l13.4-8.2a1.4 1.4 0 0 0 0-2.4L8.2 2.6C7.2 2 6 2.7 6 3.8z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="5" height="18" rx="1.6" fill="currentColor"/><rect x="14" y="3" width="5" height="18" rx="1.6" fill="currentColor"/></svg>
            </button>
            <button id="next" title="Próxima" data-i18n-title="islandNext">
              <svg class="i-skip" viewBox="0 0 32 18" aria-hidden="true"><path d="M2 2.2v13.6c0 1 1.1 1.6 1.9 1l9.5-6.6a1.5 1.5 0 0 0 0-2.4L3.9 1.2C3.1.6 2 1.2 2 2.2zM17 2.2v13.6c0 1 1.1 1.6 1.9 1l9.5-6.6a1.5 1.5 0 0 0 0-2.4l-9.5-6.6c-.8-.6-1.9 0-1.9 1z" fill="currentColor"/></svg>
            </button>
            <!-- Direita: o tempo de agora (abre a página do clima); sem cidade salva, +1 copo de água -->
            <button class="side gone" id="wxQuick" title="Clima" data-i18n-title="islandWeather"></button>
            <button class="side" id="waterQuick" title="Água" aria-label="Água">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6c3.8 4.5 6.6 8 6.6 11.4a6.6 6.6 0 0 1-13.2 0C5.4 10.6 8.2 7.1 12 2.6z" fill="currentColor"/><path d="M12 10.8v6M9 13.8h6" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </section>

        <!-- Página: Pomodoro (só com ele ligado nas configurações) -->
        <section class="page" data-page="focus" hidden>
          <div class="focus">
            <!-- Em cima, como no player: anel com o relógio (no lugar da capa), fase e ciclo, e o tempo grande à direita -->
            <div class="focus-head">
              <div class="focus-art">
                <svg class="focus-ring" viewBox="0 0 48 48" aria-hidden="true">
                  <circle cx="24" cy="24" r="20" class="ring-bg"/>
                  <circle cx="24" cy="24" r="20" class="ring-fg" id="focusRingFg"/>
                </svg>
                <svg class="focus-clock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#efe2e2"/><path d="M12 6.5V12l3.6 2.2" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div class="focus-text">
                <b id="focusPhase"></b>
                <span id="focusCycle"></span>
              </div>
              <b class="focus-time" id="focusTime">25:00</b>
            </div>
            <!-- Embaixo, como os controles do player: parar, começar/pausar, pular -->
            <div class="focus-buttons">
              <button id="focusStop" class="soft" title="Parar" data-i18n-title="focusStop">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
              </button>
              <button id="focusMain" class="main" title="Começar" data-i18n-title="focusStart">
                <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.8v16.4c0 1.1 1.2 1.8 2.2 1.2l13.4-8.2a1.4 1.4 0 0 0 0-2.4L8.2 2.6C7.2 2 6 2.7 6 3.8z" fill="currentColor"/></svg>
                <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="5" height="18" rx="1.6" fill="currentColor"/><rect x="14" y="3" width="5" height="18" rx="1.6" fill="currentColor"/></svg>
              </button>
              <button id="focusSkip" class="soft" title="Pular" data-i18n-title="focusSkip">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4.3v15.4c0 1 1.1 1.6 1.9 1l11-7.7a1.2 1.2 0 0 0 0-2L4.9 3.3C4.1 2.7 3 3.3 3 4.3z" fill="currentColor"/><rect x="17.5" y="3" width="3.5" height="18" rx="1.4" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
        </section>

        <!-- Página: água (só com o lembrete ligado) -->
        <section class="page" data-page="water" hidden>
          <div class="water">
            <svg class="bottle" viewBox="0 0 14 28" aria-hidden="true"><path d="M4.6 0h4.8c.6 0 1 .4 1 1v2.3H3.6V1c0-.6.4-1 1-1z"/><path d="M3.5 4h7v1.2c0 .7.4 1.2 1 1.7 1 .9 1.5 1.8 1.5 3.1V25a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V10c0-1.3.5-2.2 1.5-3.1.6-.5 1-1 1-1.7z"/><path class="bottle-drop" d="M7 12.6c1.8 2.2 2.9 3.8 2.9 5.3a2.9 2.9 0 0 1-5.8 0c0-1.5 1.1-3.1 2.9-5.3z"/></svg>
            <div class="water-text">
              <b data-i18n="water">Água hoje</b>
              <span id="waterAmount"></span>
            </div>
          </div>
          <div class="water-bar"><span id="waterFill"></span></div>
          <div class="water-buttons">
            <button class="water-minus" id="waterMinus" aria-label="−">−</button>
            <button class="water-add" id="waterPlus"></button>
          </div>
        </section>

        <!-- Página: agenda (só com o endereço iCal salvo nas configurações); o JS monta a lista -->
        <section class="page" data-page="agenda" hidden>
          <div class="agenda">
            <div class="agenda-head">
              <svg class="agenda-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2.5a1 1 0 0 1 1 1V5h8V3.5a1 1 0 1 1 2 0V5h.5A2.5 2.5 0 0 1 21 7.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-11A2.5 2.5 0 0 1 5.5 5H6V3.5a1 1 0 0 1 1-1z" fill="currentColor"/><path d="M3 9.5h18" stroke="#000" stroke-width="1.6"/><path d="M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg>
              <b data-i18n="islandAgenda">Agenda</b>
            </div>
            <ul class="agenda-list" id="agendaList"></ul>
          </div>
        </section>

        <!-- Página: clima (só com a cidade salva nas configurações); o JS preenche -->
        <section class="page" data-page="weather" hidden>
          <div class="wx">
            <!-- Em cima, como no player: ícone grande (no lugar da capa), cidade e condição, temperatura grande à direita -->
            <div class="wx-top">
              <span class="wx-icon" id="wxIcon"></span>
              <div class="wx-main">
                <b class="wx-place" id="wxPlace"></b>
                <span class="wx-cond" id="wxCond"></span>
              </div>
              <div class="wx-side">
                <span class="wx-temp" id="wxTemp">—</span>
                <span class="wx-range" id="wxRange"></span>
              </div>
            </div>
            <ul class="wx-hours" id="wxHours"></ul>
          </div>
        </section>

        <button class="page-arrow right" id="pageNext" aria-label="›">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="dots" id="dots"></div>
      <!-- Tema Vidro: barra de abas no lugar das bolinhas (o JS monta os botões e anima a pílula) -->
      <nav class="tabbar" id="tabbar" hidden><span class="tab-pill" id="tabPill"></span><span class="tab-drop" id="tabDrop"></span></nav>
      <!-- Pomodoro rodando: a bolha de fora "entra" aqui quando a ilha abre (anel + tempo que falta) -->
      <div class="pomo-chip" id="pomoChip" aria-hidden="true">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" class="ring-bg"/><circle cx="10" cy="10" r="8" class="ring-fg" id="chipRingFg"/></svg>
        <b id="pomoChipTime"></b>
      </div>

    </div>
  </div>

  <script src="shared.js"></script>
  <script src="island.js"></script>
</body>
</html>
