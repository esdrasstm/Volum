<!DOCTYPE html>
<!--
  Demo interativa do Volum para a landing page.
  Usa o CSS e o JS DO APP (../LeveMixerWeb/wwwroot/): mudou o visual do app, a demo muda junto.
  A estrutura abaixo é cópia do LeveMixerWeb/wwwroot/index.html (de <main> até </main>):
  se mudar o HTML do app, copie de novo para cá.
  O demo-bridge.js faz o papel do C# (volumes, medidores, microfone).
-->
<html lang="pt-BR" data-theme="dark" data-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volum (demo)</title>
  <link rel="stylesheet" href="../LeveMixerWeb/wwwroot/style.css">
  <link rel="stylesheet" href="../LeveMixerWeb/wwwroot/mascot.css">
  <style>
    /* Só para a demo: cantos mais redondos (no app quem arredonda é o Windows) */
    .card { border-radius: 14px; }
    :root.glass .card { border-radius: 14px; }
    :root.lite .card { border-radius: 14px; }
    /* Cores da LP (laranja, direção do Figma). Só na demo: o app continua com as cores dele */
    :root, :root[data-scheme="light"] {
      --accent: #ed5a23;
      --accent-2: #f5895a;
      --accent-ring: rgba(237, 90, 35, .28);
      --accent-glow: rgba(237, 90, 35, .5);
    }

    html { background: transparent; }
    /* Imita o tom do acrílico do Windows (no app quem pinta isso é o próprio Windows):
       sem ele, o tema claro ficaria escuro em cima do fundo escuro da página */
    :root.glass body { background: rgba(38, 22, 16, .5); }
    :root.glass[data-scheme="light"] body { background: rgba(243, 242, 250, .72); }
    body { min-height: 100vh; }
  </style>
</head>
<body>

  <main id="card" class="card">

    <!-- Cabeçalho: logo + nome + configurações + minimizar -->
    <header class="header">
      <!-- Para usar sua logo: troque este <svg> por <img class="logo" src="logo.png" alt=""> -->
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f5895a"/>
            <stop offset="1" stop-color="#e04a12"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="15.5" fill="url(#logoGrad)"/>
        <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".95">
          <line x1="9.5"  y1="8" x2="9.5"  y2="24"/>
          <line x1="16"   y1="8" x2="16"   y2="24"/>
          <line x1="22.5" y1="8" x2="22.5" y2="24"/>
        </g>
        <g fill="#fff">
          <circle cx="9.5"  cy="19.5" r="3.4"/>
          <circle cx="16"   cy="11.5" r="3.4"/>
          <circle cx="22.5" cy="17"   r="3.4"/>
        </g>
      </svg>
      <span class="brand">Volum</span>

      <!-- Sugestões e bugs: abre o formulário no site (pelo C#) -->
      <button id="feedbackBtn" class="icon-btn" title="Sugestões e bugs" data-i18n-title="feedback">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H8l-3 2.5v-2.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z"
                fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M5.5 7.5h.01M8 7.5h.01M10.5 7.5h.01" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Travar o teclado para limpar (o C# trava e mostra o aviso com o botão Destravar) -->
      <button id="kbLockBtn" class="icon-btn" title="Travar teclado para limpar" data-i18n-title="kbLock">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1.75" y="4" width="12.5" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M4.5 6.75h.01M7 6.75h.01M9.5 6.75h.01M12 6.75h.01M5.5 9.5h5" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Configurações: abre a janela própria de configurações (pelo C#) -->
      <button id="settingsBtn" class="icon-btn" title="Configurações" data-i18n-title="settings">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <circle cx="8" cy="8" r="2.2"/>
            <path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/>
          </g>
        </svg>
      </button>

      <!-- Minimizar: esconde o mixer (volta para a bandeja) -->
      <button id="minimizeBtn" class="icon-btn" title="Minimizar" data-i18n-title="minimize">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Volume geral + microfone (a linha do microfone some se não houver microfone) -->
    <section class="panel master">
      <div id="master"></div>
      <div id="mic" class="mic" hidden>
        <div id="micRow"></div>
        <!-- Escolher o microfone: nome do atual, discreto; o clique abre a lista dos conectados -->
        <div class="mic-picker">
          <button id="micPickBtn" class="mic-current" aria-expanded="false"
                  title="Escolher microfone" data-i18n-title="micPick">
            <span id="micCurrent"></span>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 6.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="micList" class="mic-list" inert>
            <div class="mic-list-inner" role="listbox"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Água bebida hoje (só com o lembrete de água ligado) -->
    <section id="water" class="panel water" hidden>
      <div class="water-row">
        <svg class="water-drop" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.8c3.6 4.4 6.2 7.8 6.2 11a6.2 6.2 0 0 1-12.4 0c0-3.2 2.6-6.6 6.2-11z"/>
        </svg>
        <div class="water-text">
          <span class="water-label" data-i18n="water">Água hoje</span>
          <span class="water-amount" id="waterAmount"></span>
        </div>
        <button id="waterMinus" class="icon-btn" title="Tirar um copo" data-i18n-title="waterMinus">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 8h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="waterPlus" class="water-add"></button>
      </div>
      <div class="water-bar"><span id="waterFill"></span></div>
    </section>

    <!-- Apps -->
    <div class="section-label">
      <span data-i18n="apps">Aplicativos</span>
      <span id="appCount" class="count">0</span>
    </div>
    <section id="apps" class="apps"></section>
    <p id="empty" class="empty" hidden data-i18n="empty">Nenhum app usando áudio agora</p>

    <!-- Novidades: aparece uma vez, na primeira abertura depois de atualizar (textos no NEWS do shared.js) -->
    <div id="news" class="news" hidden role="dialog" aria-modal="true" aria-labelledby="newsTitle">
      <div class="news-box">
        <!-- Mascote: a bolinha laranja do Volum, de fone, flutuando e piscando o olho -->
        <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="mascotGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f7a07a"/>
              <stop offset="1" stop-color="#e04a12"/>
            </linearGradient>
          </defs>
          <ellipse class="m-shadow" cx="60" cy="110" rx="26" ry="4.5" fill="#000"/>
          <g class="m-float">
            <path class="m-wave" d="M104 50q6 8 0 16" fill="none" stroke="#f5895a" stroke-width="3" stroke-linecap="round"/>
            <path class="m-wave w2" d="M110 44q10 14 0 28" fill="none" stroke="#f5895a" stroke-width="3" stroke-linecap="round"/>
            <circle cx="60" cy="60" r="40" fill="url(#mascotGrad)"/>
            <ellipse cx="45" cy="36" rx="12" ry="7" fill="#fff" opacity=".28" transform="rotate(-25 45 36)"/>
            <path d="M22 58a38 38 0 0 1 76 0" fill="none" stroke="#2b1a12" stroke-width="6" stroke-linecap="round"/>
            <rect x="13" y="49" width="15" height="24" rx="7" fill="#2b1a12"/>
            <rect x="92" y="49" width="15" height="24" rx="7" fill="#2b1a12"/>
            <ellipse cx="38" cy="72" rx="6" ry="3.5" fill="#ffb3a0" opacity=".55"/>
            <ellipse cx="82" cy="72" rx="6" ry="3.5" fill="#ffb3a0" opacity=".55"/>
            <g>
              <ellipse cx="47" cy="58" rx="7" ry="8.5" fill="#fff"/>
              <circle cx="48" cy="59.5" r="4" fill="#2b1a12"/>
              <circle cx="49.5" cy="57.5" r="1.3" fill="#fff"/>
            </g>
            <g class="m-wink">
              <ellipse cx="73" cy="58" rx="7" ry="8.5" fill="#fff"/>
              <circle cx="74" cy="59.5" r="4" fill="#2b1a12"/>
              <circle cx="75.5" cy="57.5" r="1.3" fill="#fff"/>
            </g>
            <path d="M51 74q9 9 18 0z" fill="#5a1a06"/>
          </g>
        </svg>
        <h2 id="newsTitle" class="news-title"><small></small><span></span></h2>
        <ul id="newsList" class="news-list"></ul>
        <button id="newsOk" class="news-ok" data-i18n="newsOk">Entendi!</button>
      </div>
    </div>

  </main>

  <script src="demo-bridge.js"></script>
  <script src="../LeveMixerWeb/wwwroot/shared.js"></script>
  <script src="../LeveMixerWeb/wwwroot/app.js"></script>
</body>
</html>
